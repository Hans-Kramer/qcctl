#
# qcctl profiles for the Arduino Ventuno Q (monza / QCS8275).
#
# Two rules to keep in mind while editing:
#   - A setting you omit is NOT touched. There is no implied default.
#   - Every number carries its unit. A bare number is a parse error.
#
# CPU frequencies are kHz because several OPPs are not whole MHz
# (2361600 kHz = 2361.6 MHz). GPU is Hz, as devfreq reports it.
#
# At the time of writing, this board has THREE policies:
# 0 = CPU0-1 (A78C, to 2112000kHz),
# 2 = CPU2-3 (A78C, to 2361600kHz),
# 4 = CPU4-7 (A55, to 1958400kHz).
# BUILD_ID=20260710-235

< PROFILE ID=0 NAME=maxperf >
  CPU_POLICY 0  GOVERNOR performance  MIN 2112000kHz  MAX 2112000kHz
  CPU_POLICY 2  GOVERNOR performance  MIN 2361600kHz  MAX 2361600kHz
  CPU_POLICY 4  GOVERNOR performance  MIN 1958400kHz  MAX 1958400kHz
  GPU           GOVERNOR performance  MIN 877000000Hz MAX 877000000Hz
>

< PROFILE ID=1 NAME=balanced DEFAULT >
  CPU_POLICY 0  GOVERNOR schedutil  MIN 902400kHz  MAX 2112000kHz
  CPU_POLICY 2  GOVERNOR schedutil  MIN 940800kHz  MAX 2361600kHz
  CPU_POLICY 4  GOVERNOR schedutil  MIN 844800kHz  MAX 1958400kHz
  GPU           GOVERNOR simple_ondemand  MIN 479000000Hz  MAX 877000000Hz
>

< PROFILE ID=2 NAME=quiet >
  CPU_POLICY 0  GOVERNOR schedutil  MAX 1497600kHz
  CPU_POLICY 2  GOVERNOR schedutil  MAX 1497600kHz
  CPU_POLICY 4  GOVERNOR schedutil  MAX 1497600kHz
  GPU           GOVERNOR powersave
  THERMAL_ZONE  cpuss-0-0  TRIP 2 TEMP 45C HYST 5C
>

< PROFILE ID=4 NAME=workstation >
  # Hands the fan to the daemon so a real curve can run.
  CPU_POLICY 0  GOVERNOR schedutil  MAX 2112000kHz
  CPU_POLICY 2  GOVERNOR schedutil  MAX 2361600kHz
  CPU_POLICY 4  GOVERNOR schedutil  MAX 1958400kHz
  GPU           GOVERNOR simple_ondemand
  FAN  MODE  curve
  FAN  CURVE desktop
>

# FALLBACK: applied when a recorded selection exists but cannot be honoured.
< PROFILE ID=3 NAME=lowpower FALLBACK >
  # A55 cluster only.
  CPU_POLICY 0  GOVERNOR powersave  MAX 1190400kHz
  CPU_POLICY 2  GOVERNOR powersave  MAX 1094400kHz
  CPU_POLICY 4  GOVERNOR powersave  MAX 1113600kHz
  CPU_ONLINE 1 0
  CPU_ONLINE 3 0
  GPU           GOVERNOR powersave  MAX 479000000Hz
  UCLAMP        MIN 512  MAX 512
  FAN  MODE  curve
  FAN  CURVE fallback
>
