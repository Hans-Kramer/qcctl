#
# The gate from the README, run automatically. Two jobs: `check` is
# self-contained, and `stage` exercises the packaging path, which has a hard
# dependency on a cross-built qcstats from the sibling repository.

name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc clang gcc-aarch64-linux-gnu

      - name: Assert every toolchain is present
        # `make check` SKIPS a compiler it cannot find, with a notice rather
        # than a failure. That is right on a developer's machine and wrong
        # here: a runner missing clang or the cross compiler would report a
        # green gate while having checked a fraction of it.
        run: |
          for c in gcc clang aarch64-linux-gnu-gcc; do
            command -v "$c" >/dev/null 2>&1 || { echo "::error::missing toolchain: $c"; exit 1; }
            printf '%-24s %s\n' "$c" "$("$c" --version | head -1)"
          done

      - name: make check
        # gcc, then clang, then the aarch64 cross build, all at
        # -Wall -Wextra -Werror -O2. Leaves build/ native and populated.
        # Each of those passes now builds the tests too, so test code holds the same bar.
        run: make check

      - name: make test
        # `check` compiles; this runs code. Each test file fails if any check failed OR if
        # it checked nothing at all - a suite that cannot fail is not a gate.
        run: |
          out=$(make test 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          # A shell test that skips is a test that is not running. On a runner there is
          # nothing to be missing, so a skip is a fault, not a notice.
          if printf '%s\n' "$out" | grep -q SKIPPED; then
            echo "::error::a test skipped in CI, where it has to run"
            exit 1
          fi

      - name: Shell scripts parse
        run: |
          for s in scripts/install.sh scripts/uninstall.sh scripts/fan-release.sh; do
            sh -n "$s" && echo "ok  $s"
          done

      - name: Installer help output is the header, not shell source
        # Both installers print a line range of their own header. A range that
        # drifts past the header leaks `set -u` and the SPDX line to the user.
        run: |
          for s in scripts/install.sh scripts/uninstall.sh; do
            out=$(sh "$s" --help)
            echo "$out" | grep -q 'SPDX' && { echo "::error file=$s::--help leaks the SPDX line"; exit 1; }
            echo "$out" | grep -qE '^(set -u|[A-Z]+=[0-9])' && { echo "::error file=$s::--help leaks shell source"; exit 1; }
            echo "ok  $s --help"
          done

      - name: Every binary answers --help with 0
        # The installer refuses to install a binary that cannot run on the board, and that
        # test is `--help` exiting 0. One that stops answering fails the install, on the
        # board, after the files are already copied. This fails the push instead.
        run: |
          make all >/dev/null
          for b in qcctl qcctld qcctl-check qcctl-surface-dump; do
            ./build/$b --help >/dev/null \
              || { echo "::error file=src::$b --help did not exit 0"; exit 1; }
            echo "ok  $b --help"
          done

      - name: Every OWNED path is known to the uninstaller
        # install.sh records what it creates in a manifest, but --force exists for when no
        # manifest survives, and uninstall.sh then falls back to a hand-written list. A path
        # the installer creates and that list omits is one --force leaves behind for good.
        #
        # Three things this has to get right, each of which the first version got wrong.
        # Continuations are joined, or a put whose destination is on the next line yields an
        # empty entry that word splitting drops. The comparison is a whole-line match against
        # the KNOWN block alone, not a substring search of the file, which passed for every
        # path that is a prefix of a sibling or is named in a comment. And both sets are
        # size-checked, because a comparison over an empty set passes having checked nothing.
        run: |
          I=scripts/install.sh; U=scripts/uninstall.sh
          STATE=$(sed -n 's/^STATE=//p' "$I")
          ETC=$(sed -n 's/^ETC=//p' "$I")
          UNITDIR=$(sed -n 's/^UNITDIR=//p' "$I")
          joined=$(sed -e :a -e '/\\$/{N;s/\\\n[[:space:]]*/ /;ba' -e '}' "$I")
          raw=$(
            printf '%s\n' "$joined" | grep -E '(^|&&[[:space:]]*)[[:space:]]*put ' |
              grep -v 'CONFIG[[:space:]]*$' |
              sed -E 's/.*put[[:space:]]+[0-7]+[[:space:]]+("[^"]*"|[^[:space:]]+)[[:space:]]+//; s/[[:space:]].*$//; s/"//g'
            printf '%s\n' "$joined" | grep -E 'record OWNED' |
              sed -E 's/.*record OWNED[[:space:]]+//; s/"//g; s/[[:space:]].*$//'
          )
          owned=
          for d in $raw; do
            case "$d" in
              '$STATE'*)   d=$STATE${d#\$STATE} ;;
              '$ETC'*)     d=$ETC${d#\$ETC} ;;
              '$UNITDIR'*) d=$UNITDIR${d#\$UNITDIR} ;;
            esac
            case "$d" in /*) owned="$owned$d
          " ;; esac
          done
          owned=$(printf '%s' "$owned" | sort -u)
          known=$(sed -n '/^KNOWN="/,/"$/p' "$U" | sed 's/^KNOWN="//; s/"$//' | grep '^/' | sort -u)
          no=$(printf '%s\n' "$owned" | grep -c .); nk=$(printf '%s\n' "$known" | grep -c .)
          [ "$no" -ge 10 ] || { echo "::error file=$I::extracted only $no OWNED paths; the extractor is broken, not the list"; exit 1; }
          [ "$nk" -ge 10 ] || { echo "::error file=$U::parsed only $nk entries out of the KNOWN block"; exit 1; }
          printf '%s\n' "$owned" | grep -qx /usr/sbin/qcctld || { echo "::error file=$I::extraction lost a path it must always find"; exit 1; }
          rc=0
          for p in $owned; do
            printf '%s\n' "$known" | grep -qxF -- "$p" ||
              { echo "::error file=$U::install.sh creates $p, the KNOWN fallback list omits it"; rc=1; }
          done
          echo "compared $no OWNED paths against $nk KNOWN entries"
          exit $rc

      - name: Every file carries an SPDX identifier
        # The project's own convention, enforced. This is what a REUSE lint
        # would check; doing it inline keeps the zero-dependency promise.
        run: |
          rc=0
          for f in $(git ls-files); do
            case "$f" in
              LICENSE|LICENSES/*) continue ;;
              # Captured data: sysfs values and one qcstats stream, both machine output
              # rather than authored content. tests/fixtures/*/README.md declares each tree.
              tests/fixtures/*/*) continue ;;
            esac
            grep -qI "SPDX-License-Identifier:" "$f" 2>/dev/null \
              || { echo "::error file=$f::no SPDX-License-Identifier"; rc=1; }
          done
          exit $rc

  stage:
    # The packaging path is the only thing with a cross-repo dependency:
    # `make stage` refuses to run until ../qcstats/qcstats exists and is an
    # aarch64 binary. Kept as its own job so a failure here is legible as a
    # packaging failure rather than a compilation one.
    runs-on: ubuntu-latest
    steps:
      - name: Check out qcctl
        uses: actions/checkout@v4
        with:
          path: qcctl

      - name: Check out the sibling qcstats
        uses: actions/checkout@v4
        with:
          repository: Hans-Kramer/qcstats
          path: qcstats

      - name: Install toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc gcc-aarch64-linux-gnu

      - name: Cross-build qcstats for the board
        run: make -C qcstats cross

      - name: make stage
        # Verifies every staged binary is aarch64 and restores this tree to
        # native on the way out. Exits non-zero if qcstats is missing or is a
        # host binary, which is the failure this job exists to catch.
        run: make -C qcctl stage

      - name: Report what was staged
        run: ls -l /tmp/qcctl-stage

  aarch64:
    # The board's architecture. Until now it was compiled and never executed: char is
    # unsigned on aarch64 and signed on x86, and the suite is what makes that difference
    # visible. GitHub's arm64 Linux runners are free for public repositories; if this job
    # cannot find a runner, that is what the first run will say.
    #
    # No cross toolchain is installed here, so `make check`'s aarch64 pass reports itself
    # SKIPPED - native already IS that architecture, which the last step asserts.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc clang

      - name: make check
        run: make check

      - name: make test
        run: |
          out=$(make test 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          # A shell test that skips is a test that is not running. On a runner there is
          # nothing to be missing, so a skip is a fault, not a notice.
          if printf '%s\n' "$out" | grep -q SKIPPED; then
            echo "::error::a test skipped in CI, where it has to run"
            exit 1
          fi

      - name: Assert these binaries really are aarch64
        run: |
          for b in build/qcctl build/qcctld build/qcctl-check build/qcctl-surface-dump; do
            got=$(od -An -tx1 -j18 -N1 "$b" | tr -d ' \n')
            [ "$got" = "b7" ] \
              || { echo "::error file=$b::e_machine 0x$got, not aarch64"; exit 1; }
            echo "ok  $b e_machine=0x$got"
          done

  contract:
    # The one thing neither repository can test alone. qcctl parses qcstats' NDJSON with
    # strstr, so a renamed field makes this consumer read "not measured" forever - a valid
    # answer in that schema, and therefore silent. And the schema version is two constants
    # in two repositories, kept equal by hand with no build-time check.
    #
    # Both are built NATIVELY here: the stage job cross-builds for the board, and a runner
    # cannot execute that.
    runs-on: ubuntu-latest
    steps:
      - name: Check out qcctl
        uses: actions/checkout@v4
        with:
          path: qcctl

      - name: Check out the sibling qcstats
        uses: actions/checkout@v4
        with:
          repository: Hans-Kramer/qcstats
          path: qcstats

      - name: Install toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc

      - name: The two schema constants must agree
        run: |
          a=$(sed -n 's/^#define QCSTATS_JSON_SCHEMA  *\([0-9]*\).*/\1/p' \
                qcstats/src/qcstats.h)
          b=$(sed -n 's/^#define STATS_SCHEMA_V  *\([0-9]*\).*/\1/p' qcctl/src/stats.h)
          echo "qcstats emits v${a:-?}, qcctl reads v${b:-?}"
          [ -n "$a" ] && [ -n "$b" ] \
            || { echo "::error::a schema constant could not be extracted - the check is"\
                      " broken, not the code"; exit 1; }
          [ "$a" = "$b" ] \
            || { echo "::error::schema mismatch: qcstats emits $a, qcctl reads $b. Every"\
                      " line of another version counts as NO READING."; exit 1; }

      - name: Generate a stream from qcstats' own fixture
        # No board: the producer runs against its committed capture.
        run: |
          make -C qcstats all
          fx=$(ls -d qcstats/tests/fixtures/monza-* | head -1)
          echo "fixture: $fx"
          QCSTATS_SYSROOT="$fx" qcstats/qcstats --json --count 2 > /tmp/live.ndjson
          head -c 100 /tmp/live.ndjson; echo

      - name: qcctl parses the stream it was just handed
        # Twice over: the committed copy proves the parser handles the documented shape, the
        # freshly generated line is what catches the producer drifting away from it.
        run: |
          make -C qcctl tests
          cd qcctl
          ./build/tests/t_contract
          ./build/tests/t_contract /tmp/live.ndjson

      - name: The shell suite, with the installer in a container
        # This job is where the shell tests belong: tests/sh/t_install.sh stages a NATIVE
        # build, which needs the sibling qcstats, and then installs as real root inside a
        # disposable container. In the `check` job - qcctl alone - it skips for want of that
        # sibling, which is why skipping is a failure HERE.
        run: |
          cd qcctl
          out=$(sh tests/sh/run.sh 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -q SKIPPED; then
            echo "::error::a shell test skipped in CI, where it has to run"
            exit 1
          fi
